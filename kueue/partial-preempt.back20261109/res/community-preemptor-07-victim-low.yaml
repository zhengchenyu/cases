apiVersion: batch/v1
kind: Job
metadata:
  name: multi-victim-low
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: lq-multi-batch
    kueue.x-k8s.io/priority-class: preemptor-low
  annotations:
    kueue.x-k8s.io/partial-preemption: "true"
    kueue.x-k8s.io/job-min-parallelism: "2"
    kueue.x-k8s.io/elastic-job: "true"
spec:
  parallelism: 6
  completions: 100
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: victim
        image: busybox
        command: ["sleep", "100000"]
        resources:
          requests:
            cpu: "1"
