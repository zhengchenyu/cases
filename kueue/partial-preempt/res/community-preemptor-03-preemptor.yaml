apiVersion: batch/v1
kind: Job
metadata:
  name: preemptor-high
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: lq-preemptor
    kueue.x-k8s.io/priority-class: preemptor-high
spec:
  parallelism: 4
  completions: 100
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: preemptor
        image: busybox
        command: ["sleep", "100000"]
        resources:
          requests:
            cpu: "1"
