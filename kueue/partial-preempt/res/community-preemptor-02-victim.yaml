apiVersion: batch/v1
kind: Job
metadata:
  name: preemptor-victim
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: lq-preemptor
    kueue.x-k8s.io/priority-class: preemptor-low
  annotations:
    kueue.x-k8s.io/partial-preemption: "true"
    kueue.x-k8s.io/job-min-parallelism: "1"
    # Must enable elastic job so that kueue can reset workload spec.Count
    kueue.x-k8s.io/elastic-job: "true"
spec:
  parallelism: 5
  completions: 100
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: victim
        image: busybox
        command: ["sleep", "100000"]
        resources:
          requests:
            cpu: "1"
