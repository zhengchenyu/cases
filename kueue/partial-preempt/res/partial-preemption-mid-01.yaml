apiVersion: batch/v1
kind: Job
metadata:
  name: mid-01
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: lq-multi-batch
    kueue.x-k8s.io/priority-class: preemptor-mid
  annotations:
    kueue.x-k8s.io/partial-preemption: "true"
    kueue.x-k8s.io/partial-preemption-min-count: "2"
    kueue.x-k8s.io/elastic-job: "true"
spec:
  completionMode: Indexed
  parallelism: 4
  completions: 100
  backoffLimit: 0
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
        status: "True"
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: victim
        image: busybox
        command: ["sleep", "100000"]
        resources:
          requests:
            cpu: "1"
